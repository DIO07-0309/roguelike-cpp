name: G7.2 Test Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
          libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
          libxinerama-dev libwayland-dev libxkbcommon-dev

    - name: Build raylib from source
      run: |
        git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git raylib_src
        cd raylib_src
        mkdir build && cd build
        cmake .. -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build . -j$(nproc)
        sudo cmake --install . --prefix /usr/local

    - name: Configure
      run: cmake -B build -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run Tests
      working-directory: build
      run: ctest --output-on-failure

    - name: Run World Validator
      run: python tools/world_validator.py resources
